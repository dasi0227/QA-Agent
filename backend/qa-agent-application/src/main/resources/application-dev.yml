server:
    port: ${QA_AGENT_SERVER_PORT:8080}

qa-agent:
    datasource:
        mysql:
            host: ${MYSQL_HOST:localhost}
            port: ${MYSQL_PORT:3306}
            database: ${MYSQL_DATABASE:qa_agent}
            username: ${MYSQL_USERNAME:dasi}
            password: ${MYSQL_PASSWORD:jason2004}
            jdbc-url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:qa_agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            driver-class-name: com.mysql.cj.jdbc.Driver
            minimum-idle: ${MYSQL_MINIMUM_IDLE:2}
            maximum-pool-size: ${MYSQL_MAXIMUM_POOL_SIZE:10}
            connection-timeout-ms: ${MYSQL_CONNECTION_TIMEOUT_MS:30000}
        postgres:
            host: ${POSTGRES_HOST:localhost}
            port: ${POSTGRES_PORT:5432}
            database: ${POSTGRES_DATABASE:qa_agent}
            username: ${POSTGRES_USERNAME:dasi}
            password: ${POSTGRES_PASSWORD:jason2004}
            jdbc-url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:qa_agent}
            driver-class-name: org.postgresql.Driver
            minimum-idle: ${POSTGRES_MINIMUM_IDLE:2}
            maximum-pool-size: ${POSTGRES_MAXIMUM_POOL_SIZE:10}
            connection-timeout-ms: ${POSTGRES_CONNECTION_TIMEOUT_MS:30000}
    redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:jason2004}
        database: ${REDIS_DATABASE:0}
    jwt:
        secret: ${JWT_SECRET:qa-agent-dev-secret-qa-agent-dev-secret}
        issuer: ${JWT_ISSUER:qa-agent}
        access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
        refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
    mybatis:
        mysql-mapper-locations: classpath*:mapper/mysql/**/*.xml
        postgres-mapper-locations: classpath*:mapper/postgres/**/*.xml
        map-underscore-to-camel-case: true
        cache-enabled: false
        overflow: false
        max-limit: 500
    thread-pool:
        core-pool-size: ${THREAD_POOL_CORE_POOL_SIZE:8}
        max-pool-size: ${THREAD_POOL_MAX_POOL_SIZE:16}
        queue-capacity: ${THREAD_POOL_QUEUE_CAPACITY:200}
        keep-alive-seconds: ${THREAD_POOL_KEEP_ALIVE_SECONDS:60}
        thread-name-prefix: ${THREAD_POOL_THREAD_NAME_PREFIX:qa-agent-async-}
        wait-for-tasks-to-complete-on-shutdown: ${THREAD_POOL_WAIT_FOR_TASKS_TO_COMPLETE_ON_SHUTDOWN:true}
        await-termination-seconds: ${THREAD_POOL_AWAIT_TERMINATION_SECONDS:30}
