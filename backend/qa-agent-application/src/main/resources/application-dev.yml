server:
    port: ${QA_AGENT_SERVER_PORT}
    servlet:
        context-path: /qa-agent/api/v1

spring:
    kafka:
        bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
        consumer:
            group-id: qa-agent-index
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer

qa-agent:
    datasource:
        mysql:
            host: ${MYSQL_HOST}
            port: ${MYSQL_PORT}
            database: ${MYSQL_DATABASE}
            username: ${MYSQL_USERNAME}
            password: ${MYSQL_PASSWORD}
            jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            driver-class-name: com.mysql.cj.jdbc.Driver
            minimum-idle: ${MYSQL_MINIMUM_IDLE}
            maximum-pool-size: ${MYSQL_MAXIMUM_POOL_SIZE}
            connection-timeout-ms: ${MYSQL_CONNECTION_TIMEOUT_MS}
        postgres:
            host: ${POSTGRES_HOST}
            port: ${POSTGRES_PORT}
            database: ${POSTGRES_DATABASE}
            username: ${POSTGRES_USERNAME}
            password: ${POSTGRES_PASSWORD}
            jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
            driver-class-name: org.postgresql.Driver
            minimum-idle: ${POSTGRES_MINIMUM_IDLE}
            maximum-pool-size: ${POSTGRES_MAXIMUM_POOL_SIZE}
            connection-timeout-ms: ${POSTGRES_CONNECTION_TIMEOUT_MS}
    mybatis:
        mysql-mapper-locations: classpath*:mapper/mysql/**/*.xml
        postgres-mapper-locations: classpath*:mapper/postgres/**/*.xml
        map-underscore-to-camel-case: true
        cache-enabled: false
        overflow: false
        max-limit: 500
    redis:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD}
        database: ${REDIS_DATABASE}
    jwt:
        secret: ${JWT_SECRET}
        issuer: ${JWT_ISSUER}
        access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES}
        refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS}
    thread-pool:
        core-pool-size: ${THREAD_POOL_CORE_POOL_SIZE}
        max-pool-size: ${THREAD_POOL_MAX_POOL_SIZE}
        queue-capacity: ${THREAD_POOL_QUEUE_CAPACITY}
        keep-alive-seconds: ${THREAD_POOL_KEEP_ALIVE_SECONDS}
        thread-name-prefix: ${THREAD_POOL_THREAD_NAME_PREFIX}
        wait-for-tasks-to-complete-on-shutdown: ${THREAD_POOL_WAIT_FOR_TASKS_TO_COMPLETE_ON_SHUTDOWN}
        await-termination-seconds: ${THREAD_POOL_AWAIT_TERMINATION_SECONDS}
    mail:
        host: ${QA_AGENT_MAIL_HOST}
        port: ${QA_AGENT_MAIL_PORT}
        username: ${QA_AGENT_MAIL_USERNAME}
        password: ${QA_AGENT_MAIL_PASSWORD}
    kafka:
        topic-document-index: document.index
        topic-document-index-dlq: document.index.dlq
        topic-qa-item-assist: qa.item.assist
        topic-qa-item-assist-dlq: qa.item.assist.dlq
    xxl-job:
        admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
        app-name: qa-agent
        port: ${XXL_JOB_EXECUTOR_PORT:9999}
        access-token: ${XXL_JOB_ACCESS_TOKEN:}
        log-path: /var/log/xxl-job
        log-retention-days: 30
    avatar:
        default-url: https://${ALIYUN_OSS_BUCKET_NAME}.${ALIYUN_OSS_ENDPOINT}/avatar/default.png
    oss:
        endpoint: ${ALIYUN_OSS_ENDPOINT}
        access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
        access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
        bucket-name: ${ALIYUN_OSS_BUCKET_NAME}
    dashscope:
        api-key: ${DASHSCOPE_API_KEY}
        embedding-model: ${DASHSCOPE_EMBEDDING_MODEL}
        rerank-model: ${DASHSCOPE_RERANK_MODEL}
    llm:
        supervisor:
            base-url: ${SUPERVISOR_LLM_BASE_URL}
            api-key: ${SUPERVISOR_LLM_API_KEY}
            model: ${SUPERVISOR_LLM_MODEL}
        web-search:
            base-url: ${WEB_SEARCH_LLM_BASE_URL}
            api-key: ${WEB_SEARCH_LLM_API_KEY}
            model: ${WEB_SEARCH_LLM_MODEL}
        rewriter:
            base-url: ${REWRITER_LLM_BASE_URL}
            api-key: ${REWRITER_LLM_API_KEY}
            model: ${REWRITER_LLM_MODEL}
        summarizer:
            base-url: ${SUMMARIZER_LLM_BASE_URL}
            api-key: ${SUMMARIZER_LLM_API_KEY}
            model: ${SUMMARIZER_LLM_MODEL}
