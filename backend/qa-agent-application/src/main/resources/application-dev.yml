server:
    port: ${QA_AGENT_SERVER_PORT}

qa-agent:
    datasource:
        mysql:
            host: ${MYSQL_HOST}
            port: ${MYSQL_PORT}
            database: ${MYSQL_DATABASE}
            username: ${MYSQL_USERNAME}
            password: ${MYSQL_PASSWORD}
            jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            driver-class-name: com.mysql.cj.jdbc.Driver
            minimum-idle: ${MYSQL_MINIMUM_IDLE}
            maximum-pool-size: ${MYSQL_MAXIMUM_POOL_SIZE}
            connection-timeout-ms: ${MYSQL_CONNECTION_TIMEOUT_MS}
        postgres:
            host: ${POSTGRES_HOST}
            port: ${POSTGRES_PORT}
            database: ${POSTGRES_DATABASE}
            username: ${POSTGRES_USERNAME}
            password: ${POSTGRES_PASSWORD}
            jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
            driver-class-name: org.postgresql.Driver
            minimum-idle: ${POSTGRES_MINIMUM_IDLE}
            maximum-pool-size: ${POSTGRES_MAXIMUM_POOL_SIZE}
            connection-timeout-ms: ${POSTGRES_CONNECTION_TIMEOUT_MS}
    redis:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD}
        database: ${REDIS_DATABASE}
    jwt:
        secret: ${JWT_SECRET}
        issuer: ${JWT_ISSUER}
        access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES}
        refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS}
    mybatis:
        mysql-mapper-locations: classpath*:mapper/mysql/**/*.xml
        postgres-mapper-locations: classpath*:mapper/postgres/**/*.xml
        map-underscore-to-camel-case: true
        cache-enabled: false
        overflow: false
        max-limit: 500
    thread-pool:
        core-pool-size: ${THREAD_POOL_CORE_POOL_SIZE}
        max-pool-size: ${THREAD_POOL_MAX_POOL_SIZE}
        queue-capacity: ${THREAD_POOL_QUEUE_CAPACITY}
        keep-alive-seconds: ${THREAD_POOL_KEEP_ALIVE_SECONDS}
        thread-name-prefix: ${THREAD_POOL_THREAD_NAME_PREFIX}
        wait-for-tasks-to-complete-on-shutdown: ${THREAD_POOL_WAIT_FOR_TASKS_TO_COMPLETE_ON_SHUTDOWN}
        await-termination-seconds: ${THREAD_POOL_AWAIT_TERMINATION_SECONDS}
    aliyun:
        oss:
            endpoint: ${ALIYUN_OSS_ENDPOINT}
            access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
            access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
            bucket-name: ${ALIYUN_OSS_BUCKET_NAME}
    avatar:
        default-url: https://${ALIYUN_OSS_BUCKET_NAME}.${ALIYUN_OSS_ENDPOINT}/avatar/default.png