<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#faf6ef;font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:linear-gradient(180deg,#faf6ef 0%,#eee7da 100%);padding:64px 0;">
  <tr>
    <td align="center" style="padding:0 20px;">

      <!-- 主卡片 -->
      <table width="460" cellpadding="0" cellspacing="0" style="background:rgba(255,255,255,0.56);border:1px solid rgba(23,22,20,0.06);border-radius:40px;padding:48px 44px 40px;max-width:460px;box-shadow:0 28px 90px rgba(77,63,40,0.08);">

        <!-- 顶部装饰线 -->
        <tr>
          <td align="center" style="padding-bottom:36px;">
            <div style="width:40px;height:3px;border-radius:999px;background:rgba(23,22,20,0.12);margin:0 auto;"></div>
          </td>
        </tr>

        <!-- Logo -->
        <tr>
          <td align="center" style="padding-bottom:40px;">
            <span style="font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;font-size:26px;font-weight:600;color:#171614;letter-spacing:-0.04em;line-height:1;">QA Agent</span>
          </td>
        </tr>

        <!-- 副标题 -->
        <tr>
          <td align="center" style="padding-bottom:32px;">
            <span style="display:inline-block;padding:4px 14px;border-radius:999px;background:rgba(23,22,20,0.05);color:#5f5a52;font-size:16px;letter-spacing:0.1em;text-transform:uppercase;">邮箱验证码</span>
          </td>
        </tr>

        <!-- 说明 -->
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <span style="font-size:14px;color:#5f5a52;line-height:1.75;">您正在注册 <strong style="color:#171614;font-weight:600;">QA Agent</strong> 账户，请输入以下验证码完成验证：</span>
          </td>
        </tr>

        <!-- 验证码卡片 -->
        <tr>
          <td align="center" style="padding-bottom:16px;">
            <table cellpadding="0" cellspacing="0" style="background:#151515;border-radius:24px;padding:24px 48px;">
              <tr>
                <td align="center" style="color:#f2eee6;font-size:38px;font-weight:600;letter-spacing:0.16em;line-height:1;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;">{{code}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- 有效期 -->
        <tr>
          <td align="center" style="padding-bottom:8px;">
            <span style="font-size:12px;color:#887f72;line-height:1.7;">验证码 5 分钟内有效，请勿转发给他人。</span>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:30px;">
            <span style="font-size:12px;color:#887f72;line-height:1.7;">如非本人操作，请忽略此邮件。</span>
          </td>
        </tr>

        <!-- 分割线 -->
        <tr>
          <td style="padding-bottom:24px;">
            <div style="border-top:1px solid rgba(23,22,20,0.08);"></div>
          </td>
        </tr>

        <!-- 底部 -->
        <tr>
          <td align="center">
            <span style="font-size:11px;color:#887f72;">QA Agent &middot; 个人笔记到面试题库</span>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
</body>
</html>
