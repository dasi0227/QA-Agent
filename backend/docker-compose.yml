services:
    mysql:
        image: mysql:8.0.40
        container_name: qa-agent-mysql
        restart: unless-stopped
        ports:
            - "${MYSQL_PORT}:3306"
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USERNAME}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            TZ: ${TZ}
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - qa-agent

    postgresql:
        image: pgvector/pgvector:0.7.4-pg16
        container_name: qa-agent-postgresql
        restart: unless-stopped
        ports:
            - "${POSTGRES_PORT}:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DATABASE}
            POSTGRES_USER: ${POSTGRES_USERNAME}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            TZ: ${TZ}
            PGTZ: ${TZ}
        volumes:
            - pgvector_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - qa-agent

    redis:
        image: redis:8.0.1
        container_name: qa-agent-redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT}:6379"
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - ${REDIS_PASSWORD}
        environment:
            TZ: ${TZ}
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        networks:
            - qa-agent

    kafka:
        image: apache/kafka:3.7.1
        container_name: qa-agent-kafka
        hostname: qa-agent-kafka
        restart: unless-stopped
        ports:
            - "${KAFKA_PORT}:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST}:${KAFKA_PORT}
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@qa-agent-kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            CLUSTER_ID: ${KAFKA_CLUSTER_ID}
            TZ: ${TZ}
        volumes:
            - kafka_data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9092'"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - qa-agent

volumes:
    mysql_data:
        name: mysql_data
    pgvector_data:
        name: pgvector_data
        external: true
    redis_data:
        name: redis_data
        external: true
    kafka_data:
        name: kafka_data
networks:
    qa-agent:
        name: qa-agent
        driver: bridge
